name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and verify all modules
        working-directory: backend
        run: mvn clean verify -DskipTests

      - name: Run tests
        working-directory: backend
        run: mvn test
        env:
          POSTGRES_USER: fixerhub
          POSTGRES_PASSWORD: fixerhub123
          JWT_SECRET: test-secret-key-must-be-at-least-256-bits-long
