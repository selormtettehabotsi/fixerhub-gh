name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # M4: single verify step — tests run as part of the build, so a test
      # failure fails the workflow (previously -DskipTests masked the build step).
      # D5: values come from GitHub Actions secrets (Settings → Secrets and
      # variables → Actions). The || fallbacks are throwaway CI-only values so
      # the build still works on forks without secrets — they are never used
      # outside this workflow and must never appear in real configuration.
      - name: Build, test and verify all modules
        working-directory: backend
        run: mvn clean verify
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER || 'ci_user' }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'ci-only-throwaway-password' }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET || 'ci-only-jwt-secret-not-used-anywhere-real-0000' }}
          GATEWAY_SECRET: ${{ secrets.CI_GATEWAY_SECRET || 'ci-only-gateway-secret-not-used-anywhere-real' }}
