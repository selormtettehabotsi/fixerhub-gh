server:
  port: 8085

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fixerhub
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
