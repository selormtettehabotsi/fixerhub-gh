server:
  port: 8085

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fixerhub
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # D3: Flyway owns the schema; Hibernate only verifies it
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0   # baseline below V1 so V1 runs even on a non-empty shared schema
    table: flyway_history_review

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

gateway:
  secret: ${GATEWAY_SECRET}
