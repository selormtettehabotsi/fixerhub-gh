server:
  port: 8082

spring:
  application:
    name: worker-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fixerhub
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # D3: Flyway owns the schema; Hibernate only verifies it
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0   # baseline below V1 so V1 runs even on a non-empty shared schema
    table: flyway_history_worker
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ${JWT_SECRET}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

gateway:
  secret: ${GATEWAY_SECRET}
