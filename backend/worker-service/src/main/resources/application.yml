server:
  port: 8082

spring:
  application:
    name: worker-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fixerhub
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

jwt:
  secret: ${JWT_SECRET:fixerhub-secret-key-must-be-at-least-256-bits-long}

google:
  maps:
    api-key: ${GOOGLE_MAPS_API_KEY}
