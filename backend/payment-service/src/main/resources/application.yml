server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fixerhub
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate   # D3: Flyway owns the schema; Hibernate only verifies it
    show-sql: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0   # baseline below V1 so V1 runs even on a non-empty shared schema
    table: flyway_history_payment
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

fixerhub:
  commission-rate: ${COMMISSION_RATE}

# Paystack payment gateway
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
  callback-url: ${PAYSTACK_CALLBACK_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

gateway:
  secret: ${GATEWAY_SECRET}
